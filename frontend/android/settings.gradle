include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
// The Play asset packs of the animations, only while the release machine builds the Play bundle
// (scripts/android/make-asset-packs.mjs writes this file and the modules; never committed). Never
// in a gym pilot product build (pilot.properties present): they are the restricted animations.
if (!file('pilot.properties').exists() && file('asset-packs.settings.gradle').exists()) {
    apply from: 'asset-packs.settings.gradle'
}
